<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="cakeBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="icing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
  </defs>

  <!-- Plate -->
  <ellipse cx="32" cy="57" rx="28" ry="4" fill="#00e5ff" opacity="0.5"/>
  <ellipse cx="32" cy="56" rx="25" ry="3" fill="#38bdf8"/>

  <!-- Bottom Tier -->
  <rect x="11" y="41" width="42" height="14" rx="4" fill="url(#cakeBase)"/>
  <!-- Bottom Icing drips -->
  <path d="M11,43 Q16,47 21,43 Q26,48 31,43 Q36,48 42,43 Q47,47 53,43 L53,41 L11,41 Z" fill="url(#icing)"/>

  <!-- Top Tier -->
  <rect x="17" y="29" width="30" height="13" rx="3" fill="#f43f5e"/>
  <!-- Top Icing drips -->
  <path d="M17,31 Q22,35 27,31 Q32,36 37,31 Q42,35 47,31 L47,29 L17,29 Z" fill="url(#icing)"/>

  <!-- Sprinkles -->
  <circle cx="20" cy="49" r="1.2" fill="#facc15"/>
  <circle cx="28" cy="51" r="1.2" fill="#38bdf8"/>
  <circle cx="36" cy="49" r="1.2" fill="#4ade80"/>
  <circle cx="44" cy="51" r="1.2" fill="#f43f5e"/>
  <circle cx="24" cy="37" r="1.1" fill="#38bdf8"/>
  <circle cx="32" cy="38" r="1.1" fill="#facc15"/>
  <circle cx="40" cy="37" r="1.1" fill="#a855f7"/>

  <!-- Three Candles -->
  <!-- Left Candle -->
  <rect x="22" y="19" width="3" height="10" rx="1" fill="#38bdf8"/>
  <path d="M23.5,14 Q26,17 23.5,19 Q21,17 23.5,14 Z" fill="url(#flame)"/>
  <circle cx="23.5" cy="16.5" r="4" fill="url(#flameGlow)"/>

  <!-- Middle Candle -->
  <rect x="30.5" y="16" width="3" height="13" rx="1" fill="#facc15"/>
  <path d="M32,11 Q34.5,14 32,16 Q29.5,14 32,11 Z" fill="url(#flame)"/>
  <circle cx="32" cy="13.5" r="4.5" fill="url(#flameGlow)"/>

  <!-- Right Candle -->
  <rect x="39" y="19" width="3" height="10" rx="1" fill="#4ade80"/>
  <path d="M40.5,14 Q43,17 40.5,19 Q38,17 40.5,14 Z" fill="url(#flame)"/>
  <circle cx="40.5" cy="16.5" r="4" fill="url(#flameGlow)"/>
</svg>